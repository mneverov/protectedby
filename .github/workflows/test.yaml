---
name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      # analysistest loads dependencies from source, so tests pass even when the
      # binary cannot read the toolchain's export data. Run the binary itself.
      - name: Run binary
        run: |
          go build -o "$RUNNER_TEMP/protectedby" .
          "$RUNNER_TEMP/protectedby" ./...
